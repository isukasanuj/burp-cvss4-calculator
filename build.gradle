plugins {
    id 'java'
}

group = 'com.cybercrew'
version = '1.0.3'

repositories {
    mavenCentral()
}

dependencies {
    // Burp supplies the Montoya API at runtime, so it is compile-only.
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
}

// Target Java 17 bytecode using whatever JDK is running the build, rather than
// requesting a specific toolchain. Any JDK from 17 upwards can build this.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName = 'cvss4-calculator'
    manifest {
        attributes(
            'Implementation-Title': 'CVSS 4.0 Calculator',
            'Implementation-Version': version,
            'Implementation-Vendor': 'CyberCrew inc',
            'Built-By': 'Isuka Sanuj'
        )
    }
}